<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Paper</title>
    <link rel="stylesheet" href="css/readpaper.css">
</head>
<body>
  <div class="page-wrapper">

    <!-- Header Section -->
    <header class="header-section">
      <div class="container">
       <div class="back-link">
  <a href="#" id="backLink">BACK TO MORE PAPERS</a>
</div>
        <div class="paper-title">
          <h1 id="paperTitle">Loading...</h1>
        </div>
        <div class="action-buttons">
          <button class="btn btn-secondary" id="discussPaper">
            DISCUSS THE PAPER
          </button>
        </div>
      </div>
    </header>

    <!-- Content Section -->
    <main class="content-section">
      <div class="container">
        <div class="paper-details">

          <div class="detail-row">
            <div class="detail-label">AUTHORS</div>
            <div class="detail-content" id="paperAuthors">Loading...</div>
          </div>

          <div class="detail-row">
            <div class="detail-label">ABSTRACT</div>
            <div class="detail-content" id="paperAbstract">Loading...</div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- Link your script -->
  <script src="js/readpaper.js"></script>
</body>
</html>
